headline: I build software to analyse high-throughput microscopy images. Beyond the
  lab, I design and ship production systems, from embedded firmware to healthcare
  platforms.
intro: "PhD in biomedical imaging, Research Fellow at Monash University, and
  founder of Zeroth, an independent consultancy. Over fifteen years I've written
  firmware for survey instruments in Paris, digitised land registration for a
  government in the UAE, built an EHR platform for doctors, and kept enterprise
  sign-in running at Auth0/Okta. The method doesn't change: understand the
  domain properly, then design something that holds up under real use."
