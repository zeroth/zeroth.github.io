# Pages CMS configuration — https://pagescms.org/docs
media:
  input: public/images
  output: /images

content:
  - name: profile
    label: Profile
    type: file
    path: src/data/profile.yml
    fields:
      - { name: name, label: Name, type: string }
      - { name: role, label: Role, type: string }
      - { name: location, label: Location, type: string }
      - { name: portrait, label: Portrait, type: image, description: "Shown as the stained specimen on slide 01. Square-ish photos work best." }
      - { name: portrait_alt, label: Portrait description (alt text), type: string }
      - { name: headline, label: Headline, type: text }
      - { name: intro, label: Intro, type: text }
      - { name: email, label: Email, type: string }
      - name: links
        label: Links
        type: object
        fields:
          - { name: linkedin, label: LinkedIn URL, type: string }
          - { name: github, label: GitHub URL, type: string, description: "Leave empty to hide" }
          - { name: scholar, label: Google Scholar URL, type: string, description: "Leave empty to hide" }
      - name: focus
        label: What I work on (index card)
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - { name: stack, label: Stack, type: string, list: true }
      - name: experience
        label: Experience (one slide each, newest first)
        type: object
        list: true
        fields:
          - { name: code, label: Accession code, type: string, description: "e.g. AP-2025-ZER" }
          - { name: org, label: Organisation, type: string }
          - { name: org_note, label: Organisation note, type: string }
          - { name: role, label: Role, type: string }
          - { name: start, label: Start year, type: string }
          - { name: end, label: End year (or 'now'), type: string }
          - { name: place, label: Place, type: string }
          - { name: specimen, label: Specimen (the headline result), type: string }
          - { name: specimen_note, label: Specimen note, type: string }
          - { name: points, label: Details, type: text, list: true }
      - name: education
        label: Education
        type: object
        list: true
        fields:
          - { name: degree, label: Degree, type: string }
          - { name: school, label: School, type: string }
          - { name: year, label: Year(s), type: string }
      - { name: certifications, label: Certifications, type: string, list: true }
      - name: languages
        label: Languages
        type: object
        list: true
        fields:
          - { name: name, label: Language, type: string }
          - { name: level, label: Level, type: string }
      - name: open_slot
        label: Open slot (contact)
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
